[package]
name = "sill-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sill's wire protocol: the 14-byte header, kinds 0-28 and their payloads, hvcC framing, identities, pairing and TLS"

[dependencies]
# All MIT OR Apache-2.0 (serde, serde_json, base64), Apache-2.0 AND ISC (ring), Apache-2.0 OR ISC OR
# MIT (rustls).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
