# Releases of Sill for Mac. Started by pushing a tag v<version>, the version in Packaging/Info.plist
# (`git tag v0.3.0 && git push origin v0.3.0` on the commit to release), or by hand with such a tag
# (Actions › Release › Run workflow). What it does depends on the repository variable
# SILL_SIGN_IN_CI (Settings › Secrets and variables › Actions › Variables):
#
# - Not set, or anything but true: verify only. It checks the tag against Packaging/Info.plist,
#   runs the pure checks, builds Sill.app with Scripts/make-app.sh (signed ad hoc: the runner has
#   no identity), makes the disk image with Scripts/make-dmg.sh (signed ad hoc too), and keeps the
#   app, zipped, and the image as this run's two artifacts for 14 days. It uses no secret and
#   creates no release.
# - true: sign and publish, in the environment release (Settings › Environments): only a tag v* may
#   use it, the job waits for Noah's approval before it starts (Review deployments, on the run's
#   page), and the secrets are that environment's, not the repository's. By hand, run it from the
#   tag itself (Use workflow from › Tags), that tag as the input too: the environment refuses a run
#   from a branch. The job builds the commit the run was started for, the one its page shows, and
#   stops if the tag no longer names it. The same checks, then the Developer ID certificate goes
#   into a temporary keychain, the notary credentials into a profile in it, the Developer ID
#   provisioning profile (the secret SILL_PROVISION_PROFILE) into
#   Packaging/embedded.provisionprofile, so the release keeps its identity in the data-protection
#   keychain as every release since 0.4.0 does, and Scripts/release.sh --publish builds Sill.app,
#   has Apple notarize it, staples the ticket, checks a copy the way Gatekeeper will, puts the
#   stapled app in the disk image and has Apple notarize that too, and creates the GitHub Release
#   v<version> with Sill.dmg, Sill.zip and their .sha256 files, the files the site's download page
#   links. The keychain is deleted at the end, whatever happened.
#
# docs/release-checklist.md, "Releasing from GitHub Actions", lists every secret and variable, the
# environments that hold the secrets (made once, before SILL_SIGN_IN_CI goes on), how to make and
# rotate them, and what a run costs (free in a public repository; in a private one, macOS minutes
# against the account's included minutes, then $0.062 a minute on 2026-09-25).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.3.0 (it must exist, and match Packaging/Info.plist)
        required: true
        type: string

permissions:
  contents: read

# Every run step under bash -eo pipefail (GitHub leaves pipefail off unless the shell is named).
defaults:
  run:
    shell: bash

# One run per tag at a time; a second one waits rather than cancel the first mid-notarization.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The tag this run releases: the one pushed, or the one given by hand. Scripts/release.sh checks
  # it against Packaging/Info.plist and the commit checked out.
  SILL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (no signing, no release)
    if: vars.SILL_SIGN_IN_CI != 'true'
    # As in ci.yml: the image with Xcode 27 (macOS 27, public preview).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.SILL_RELEASE_TAG }}
          fetch-depth: 0 # make-app.sh's build number is the commit count
          persist-credentials: false

      # A release is built with Xcode 27 or not at all (make-app.sh records the SDK in the app).
      - name: Select Xcode 27
        uses: ./.github/actions/select-xcode
        with:
          version: '27'
          fallback: 'false'

      - name: Check the tag against Packaging/Info.plist
        run: Scripts/release.sh --check-tag

      - name: Pure checks (Tests/checks/run-all.sh)
        run: Tests/checks/run-all.sh

      - name: Build Sill.app (Scripts/make-app.sh, signed ad hoc)
        run: Scripts/make-app.sh

      - name: Check Sill.app and zip it
        id: zip
        run: |
          app=.build/Sill.app
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          codesign --verify --strict "$app"
          for file in Assets.car AppIcon.icns; do
            if [ ! -f "$app/Contents/Resources/$file" ]; then
              echo "::error::Sill.app has no $file: make-app.sh could not make the icon (its warning above says why), and a signed release refuses to ship without one."
              exit 1
            fi
          done
          zip=".build/Sill-$version-adhoc.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          {
            echo "Sill $version ($build) for $(lipo -archs "$app/Contents/MacOS/Sill"): the checks passed and Sill.app built."
            echo
            echo "The artifact $(basename "$zip") is signed ad hoc, not with Developer ID, and not notarized: for trying out, not for anyone else to download. SHA-256 $(shasum -a 256 "$zip" | awk '{ print $1 }')."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The image a release publishes as Sill.dmg, made the same way from this ad hoc app: its
      # window, background and volume icon can be looked at before a signed release.
      - name: Make the disk image (Scripts/make-dmg.sh, signed ad hoc)
        id: dmg
        run: |
          app=.build/Sill.app
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          dmg=".build/Sill-$version-adhoc.dmg"
          Scripts/make-dmg.sh --sign - "$app" "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "The artifact $(basename "$dmg") is the disk image a release publishes as Sill.dmg, with this Sill.app inside, signed ad hoc and not notarized: for looking at its window, not for anyone else to download. SHA-256 $(shasum -a 256 "$dmg" | awk '{ print $1 }')."
            echo "Nothing was published: the repository variable SILL_SIGN_IN_CI is not true."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the zip as this run's artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.zip.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # A second step: with archive false, each upload takes one file.
      - name: Keep the disk image as this run's artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.dmg.outputs.dmg }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Sign, notarize and publish
    if: vars.SILL_SIGN_IN_CI == 'true'
    # The environment release (docs/release-checklist.md, "Secrets and variables"): only a tag v* may
    # use it, so GitHub refuses a run from a branch before it starts; Noah approves each run before it
    # starts; and the secrets below are its own, the repository keeps none. A run that names an
    # environment that does not exist makes it, with no rule and no secret: the first step stops there.
    environment: release
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub Release, with this repository's own token
    steps:
      # First, before anything is checked out or built. An environment without its secrets gives empty
      # strings, not an error, so a missing one is named here. And a run by hand starts from the tag it
      # releases, so the workflow that signs and publishes is that tag's own.
      - name: Check the environment's secrets and the tag
        env:
          EVENT: ${{ github.event_name }}
          SILL_DEVELOPER_ID_P12: ${{ secrets.SILL_DEVELOPER_ID_P12 }}
          SILL_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SILL_DEVELOPER_ID_P12_PASSWORD }}
          SILL_NOTARY_KEY_ID: ${{ secrets.SILL_NOTARY_KEY_ID }}
          SILL_NOTARY_ISSUER_ID: ${{ secrets.SILL_NOTARY_ISSUER_ID }}
          SILL_NOTARY_KEY_P8: ${{ secrets.SILL_NOTARY_KEY_P8 }}
          SILL_PROVISION_PROFILE: ${{ secrets.SILL_PROVISION_PROFILE }}
        run: |
          missing=""
          for name in SILL_DEVELOPER_ID_P12 SILL_DEVELOPER_ID_P12_PASSWORD SILL_NOTARY_KEY_ID SILL_NOTARY_ISSUER_ID SILL_NOTARY_KEY_P8 SILL_PROVISION_PROFILE; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets of the environment release are not set:$missing (gh secret set NAME --env release; docs/release-checklist.md, Releasing from GitHub Actions, Secrets and variables)."
            exit 1
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$SILL_RELEASE_TAG" ]; then
            echo "::error::A release by hand runs from the tag it releases: Run workflow › Use workflow from › Tags › $SILL_RELEASE_TAG, with $SILL_RELEASE_TAG as the tag too. This run is on $GITHUB_REF."
            exit 1
          fi
          echo "The environment release has its six secrets; releasing $SILL_RELEASE_TAG from $GITHUB_REF."

      # The commit this run was started for (github.sha: the tag's commit when it was pushed, or when
      # the run by hand began from it), which is this workflow file's own, the one the run's page shows
      # and so the one Noah approves; never the tag by name. Given a ref by name, actions/checkout
      # fetches whatever the tag names when the job starts and checks nothing against github.sha, so a
      # tag moved after the run began would build and sign another commit. Every tag comes too, as
      # origin has it now: "Check the tag against Packaging/Info.plist" stops the run when the tag no
      # longer names this commit.
      - name: Check out the tag's commit, the one this run was started for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # make-app.sh's build number is the commit count
          persist-credentials: false

      # A release is built with Xcode 27 or not at all (make-app.sh records the SDK in the app).
      - name: Select Xcode 27
        uses: ./.github/actions/select-xcode
        with:
          version: '27'
          fallback: 'false'

      # A tag moved or deleted after the run began stops it here, before the keychain and before
      # anything is built; then release.sh checks the tag against Packaging/Info.plist and the commit
      # checked out.
      - name: Check the tag against Packaging/Info.plist
        run: |
          started="$(git rev-parse -q --verify "$GITHUB_SHA^{commit}" || true)"
          if [ -z "$started" ] || [ "$(git rev-parse HEAD)" != "$started" ]; then
            echo "::error::The commit checked out is not $GITHUB_SHA, the one this run was started for."
            exit 1
          fi
          tagged="$(git rev-parse -q --verify "refs/tags/$SILL_RELEASE_TAG^{commit}" || true)"
          if [ "$tagged" != "$started" ]; then
            echo "::error::The tag $SILL_RELEASE_TAG names ${tagged:-no commit} now, not $GITHUB_SHA, the commit this run was started for and the one its approval showed: it was moved or deleted after the run began. Nothing was built or signed. Push the tag again for a new run, and a new approval."
            exit 1
          fi
          Scripts/release.sh --check-tag

      - name: Pure checks (Tests/checks/run-all.sh)
        run: Tests/checks/run-all.sh

      - name: Put the Developer ID certificate in a temporary keychain
        env:
          SILL_DEVELOPER_ID_P12: ${{ secrets.SILL_DEVELOPER_ID_P12 }}
          SILL_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SILL_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          p12="$RUNNER_TEMP/sill-developer-id.p12"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Inside an if, so a secret that isn't a .p12 in base64, or a wrong password, ends with this
          # step's own words naming the secrets (security's are above them), not only security's.
          if ! printf '%s' "$SILL_DEVELOPER_ID_P12" | base64 --decode > "$p12" 2>/dev/null \
              || ! security import "$p12" -k "$keychain" -f pkcs12 -P "$SILL_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign > /dev/null; then
            rm -f "$p12"
            echo "::error::SILL_DEVELOPER_ID_P12 is not the Developer ID certificate and its key as a .p12 in base64, or SILL_DEVELOPER_ID_P12_PASSWORD is not its password (base64 -i DeveloperID.p12 | gh secret set SILL_DEVELOPER_ID_P12 --env release; docs/release-checklist.md, Releasing from GitHub Actions)."
            exit 1
          fi
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # codesign and release.sh look through the user's keychain list; notarytool keeps its
          # profile in the default keychain. The image already has Apple's Developer ID
          # intermediate certificate in the System keychain.
          { echo "\"$keychain\""; security list-keychains -d user; } | xargs security list-keychains -d user -s
          security default-keychain -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found = 1 }')"
          if [ -z "$identity" ]; then
            echo "::error::SILL_DEVELOPER_ID_P12 holds no valid Developer ID Application identity (a certificate with its private key)."
            exit 1
          fi
          echo "Signing with: $(security find-identity -v -p codesigning "$keychain" | grep "$identity" | sed 's/^[^"]*//')"
          echo "SILL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store the notary credentials in that keychain
        env:
          SILL_NOTARY_KEY_ID: ${{ secrets.SILL_NOTARY_KEY_ID }}
          SILL_NOTARY_ISSUER_ID: ${{ secrets.SILL_NOTARY_ISSUER_ID }}
          SILL_NOTARY_KEY_P8: ${{ secrets.SILL_NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          key="$RUNNER_TEMP/sill-notary-key.p8"
          if ! printf '%s' "$SILL_NOTARY_KEY_P8" | base64 --decode > "$key" 2>/dev/null \
              || ! grep -q -e '-----BEGIN PRIVATE KEY-----' "$key"; then
            rm -f "$key"
            echo "::error::SILL_NOTARY_KEY_P8 is not an App Store Connect key file in base64 (base64 -i AuthKey_<Key ID>.p8 | gh secret set SILL_NOTARY_KEY_P8 --env release)."
            exit 1
          fi
          # Validates the key with Apple before saving it, so a wrong key fails here.
          if ! xcrun notarytool store-credentials sill-notary --key "$key" --key-id "$SILL_NOTARY_KEY_ID" \
              --issuer "$SILL_NOTARY_ISSUER_ID" --keychain "$keychain"; then
            rm -f "$key"
            echo "::error::Apple's notary service refused the key (notarytool's words above): SILL_NOTARY_KEY_ID and SILL_NOTARY_ISSUER_ID must be the Key ID and Issuer ID of the key in SILL_NOTARY_KEY_P8, and the key must not be revoked."
            exit 1
          fi
          rm -f "$key"
          echo "SILL_NOTARY_PROFILE=sill-notary" >> "$GITHUB_ENV"

      # The Developer ID provisioning profile (no secret inside; a secret keeps it out of the tree), at
      # the path make-app.sh --release embeds from, which .gitignore leaves out: without it a release
      # would keep its identity in the login keychain, and every Mac updating to it would pair its
      # devices again (docs/release-checklist.md, Part 1 §5). Not handed to make-app.sh as
      # SILL_PROVISION_PROFILE: that name is a path there, and the secret is base64.
      - name: Put the provisioning profile in Packaging/embedded.provisionprofile
        env:
          SILL_PROVISION_PROFILE_B64: ${{ secrets.SILL_PROVISION_PROFILE }}
        run: |
          profile=Packaging/embedded.provisionprofile
          if ! printf '%s' "$SILL_PROVISION_PROFILE_B64" | base64 --decode > "$profile" 2>/dev/null \
              || ! security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist" 2>/dev/null; then
            rm -f "$profile" "$RUNNER_TEMP/profile.plist"
            echo "::error::SILL_PROVISION_PROFILE is not a provisioning profile in base64 (base64 -i Packaging/embedded.provisionprofile | gh secret set SILL_PROVISION_PROFILE --env release)."
            exit 1
          fi
          echo "The profile: $(plutil -extract Name raw -o - "$RUNNER_TEMP/profile.plist"), until $(plutil -extract ExpirationDate raw -o - "$RUNNER_TEMP/profile.plist"). make-app.sh checks it against the app's entitlements and certificate."
          rm -f "$RUNNER_TEMP/profile.plist"

      - name: Build, notarize and publish (Scripts/release.sh --publish)
        env:
          # This repository's releases with its own token. For another repository's (the public
          # sill-site, while this one is private): the variable SILL_RELEASE_REPO and a token for
          # it in the environment release's secret SILL_RELEASE_TOKEN.
          SILL_RELEASE_REPO: ${{ vars.SILL_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.SILL_RELEASE_TOKEN || github.token }}
        run: Scripts/release.sh --publish

      # Both submissions' answers and logs: the zip's (Sill-<version>-notary*) and the disk image's
      # (Sill-<version>-dmg-notary*). include-hidden-files: upload-artifact skips every file and folder
      # whose name starts with a dot, the search's root included, so without it these patterns found
      # nothing under .build and the step passed without an artifact (it never kept one). No files
      # is a warning: a run that stopped before Apple answered has none.
      - name: Keep Apple's notary logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-${{ env.SILL_RELEASE_TAG }}
          path: |
            .build/Sill-*-notary.plist
            .build/Sill-*-notary-log.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Delete the keychain, the key files and the profile
        if: always()
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          rm -f "$RUNNER_TEMP/sill-developer-id.p12" "$RUNNER_TEMP/sill-notary-key.p8" "$RUNNER_TEMP/profile.plist" Packaging/embedded.provisionprofile
          if [ -f "$keychain" ]; then
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
            security delete-keychain "$keychain"
          fi
          echo "Keychains left: $(security list-keychains -d user | tr -d ' "' | tr '\n' ' ')"
