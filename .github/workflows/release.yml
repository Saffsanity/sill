# Releases of Sill for Mac. Started by pushing a tag v<version>, the version in Packaging/Info.plist
# (`git tag v0.3.0 && git push origin v0.3.0` on the commit to release), or by hand with such a tag
# (Actions › Release › Run workflow). What it does depends on the repository variable
# SILL_SIGN_IN_CI (Settings › Secrets and variables › Actions › Variables):
#
# - Not set, or anything but true: verify only. It checks the tag against Packaging/Info.plist,
#   runs the pure checks, builds Sill.app with Scripts/make-app.sh (signed ad hoc: the runner has
#   no identity), makes the disk image with Scripts/make-dmg.sh (signed ad hoc too), and keeps the
#   app, zipped, and the image as this run's two artifacts for 14 days. It uses no secret and
#   creates no release.
# - true: sign and publish. The same checks, then the Developer ID certificate goes into a
#   temporary keychain, the notary credentials into a profile in it, and Scripts/release.sh
#   --publish builds Sill.app, has Apple notarize it, staples the ticket, checks a copy the way
#   Gatekeeper will, puts the stapled app in the disk image and has Apple notarize that too, and
#   creates the GitHub Release v<version> with Sill.dmg, Sill.zip and their .sha256 files, the
#   files the site's download page links. The keychain is deleted at the end, whatever happened.
#
# Either way the windows job then builds Sill for Windows from the same tag (one version for every
# platform) on a Windows runner: Sill.exe for x64 and arm64, zipped, with .sha256 files, kept as an
# artifact, and with SILL_SIGN_IN_CI true attached to the release the Mac's job created. Unsigned.
#
# docs/release-checklist.md, "Releasing from GitHub Actions", lists every secret and variable, how
# to make and rotate them, and what a run costs (free in a public repository; in a private one,
# macOS minutes against the account's included minutes, then $0.062 a minute on 2026-09-25).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.3.0 (it must exist, and match Packaging/Info.plist)
        required: true
        type: string

permissions:
  contents: read

# Every run step under bash -eo pipefail (GitHub leaves pipefail off unless the shell is named).
defaults:
  run:
    shell: bash

# One run per tag at a time; a second one waits rather than cancel the first mid-notarization.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # The tag this run releases: the one pushed, or the one given by hand. Scripts/release.sh checks
  # it against Packaging/Info.plist and the commit checked out.
  SILL_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify (no signing, no release)
    if: vars.SILL_SIGN_IN_CI != 'true'
    # As in ci.yml: the image with Xcode 27 (macOS 27, public preview).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.SILL_RELEASE_TAG }}
          fetch-depth: 0 # make-app.sh's build number is the commit count
          persist-credentials: false

      # A release is built with Xcode 27 or not at all (make-app.sh records the SDK in the app).
      - name: Select Xcode 27
        uses: ./.github/actions/select-xcode
        with:
          version: '27'
          fallback: 'false'

      - name: Check the tag against Packaging/Info.plist
        run: Scripts/release.sh --check-tag

      - name: Pure checks (Tests/checks/run-all.sh)
        run: Tests/checks/run-all.sh

      - name: Build Sill.app (Scripts/make-app.sh, signed ad hoc)
        run: Scripts/make-app.sh

      - name: Check Sill.app and zip it
        id: zip
        run: |
          app=.build/Sill.app
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          codesign --verify --strict "$app"
          for file in Assets.car AppIcon.icns; do
            if [ ! -f "$app/Contents/Resources/$file" ]; then
              echo "::error::Sill.app has no $file: make-app.sh could not make the icon (its warning above says why), and a signed release refuses to ship without one."
              exit 1
            fi
          done
          zip=".build/Sill-$version-adhoc.zip"
          ditto -c -k --keepParent "$app" "$zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          {
            echo "Sill $version ($build) for $(lipo -archs "$app/Contents/MacOS/Sill"): the checks passed and Sill.app built."
            echo
            echo "The artifact $(basename "$zip") is signed ad hoc, not with Developer ID, and not notarized: for trying out, not for anyone else to download. SHA-256 $(shasum -a 256 "$zip" | awk '{ print $1 }')."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The image a release publishes as Sill.dmg, made the same way from this ad hoc app: its
      # window, background and volume icon can be looked at before a signed release.
      - name: Make the disk image (Scripts/make-dmg.sh, signed ad hoc)
        id: dmg
        run: |
          app=.build/Sill.app
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
          dmg=".build/Sill-$version-adhoc.dmg"
          Scripts/make-dmg.sh --sign - "$app" "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          {
            echo
            echo "The artifact $(basename "$dmg") is the disk image a release publishes as Sill.dmg, with this Sill.app inside, signed ad hoc and not notarized: for looking at its window, not for anyone else to download. SHA-256 $(shasum -a 256 "$dmg" | awk '{ print $1 }')."
            echo "Nothing was published: the repository variable SILL_SIGN_IN_CI is not true."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the zip as this run's artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.zip.outputs.zip }}
          archive: false
          retention-days: 14
          if-no-files-found: error

      # A second step: with archive false, each upload takes one file.
      - name: Keep the disk image as this run's artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.dmg.outputs.dmg }}
          archive: false
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Sign, notarize and publish
    if: vars.SILL_SIGN_IN_CI == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write # the GitHub Release, with this repository's own token
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.SILL_RELEASE_TAG }}
          fetch-depth: 0 # make-app.sh's build number is the commit count
          persist-credentials: false

      # A release is built with Xcode 27 or not at all (make-app.sh records the SDK in the app).
      - name: Select Xcode 27
        uses: ./.github/actions/select-xcode
        with:
          version: '27'
          fallback: 'false'

      - name: Check the tag against Packaging/Info.plist
        run: Scripts/release.sh --check-tag

      - name: Pure checks (Tests/checks/run-all.sh)
        run: Tests/checks/run-all.sh

      - name: Check that every secret is set
        env:
          SILL_DEVELOPER_ID_P12: ${{ secrets.SILL_DEVELOPER_ID_P12 }}
          SILL_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SILL_DEVELOPER_ID_P12_PASSWORD }}
          SILL_NOTARY_KEY_ID: ${{ secrets.SILL_NOTARY_KEY_ID }}
          SILL_NOTARY_ISSUER_ID: ${{ secrets.SILL_NOTARY_ISSUER_ID }}
          SILL_NOTARY_KEY_P8: ${{ secrets.SILL_NOTARY_KEY_P8 }}
        run: |
          missing=""
          for name in SILL_DEVELOPER_ID_P12 SILL_DEVELOPER_ID_P12_PASSWORD SILL_NOTARY_KEY_ID SILL_NOTARY_ISSUER_ID SILL_NOTARY_KEY_P8; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These repository secrets are not set:$missing. docs/release-checklist.md, Releasing from GitHub Actions."
            exit 1
          fi

      - name: Put the Developer ID certificate in a temporary keychain
        env:
          SILL_DEVELOPER_ID_P12: ${{ secrets.SILL_DEVELOPER_ID_P12 }}
          SILL_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.SILL_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          p12="$RUNNER_TEMP/sill-developer-id.p12"
          password="$(openssl rand -base64 32)"
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$SILL_DEVELOPER_ID_P12" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$SILL_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign > /dev/null
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # codesign and release.sh look through the user's keychain list; notarytool keeps its
          # profile in the default keychain. The image already has Apple's Developer ID
          # intermediate certificate in the System keychain.
          { echo "\"$keychain\""; security list-keychains -d user; } | xargs security list-keychains -d user -s
          security default-keychain -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found = 1 }')"
          if [ -z "$identity" ]; then
            echo "::error::SILL_DEVELOPER_ID_P12 holds no valid Developer ID Application identity (a certificate with its private key)."
            exit 1
          fi
          echo "Signing with: $(security find-identity -v -p codesigning "$keychain" | grep "$identity" | sed 's/^[^"]*//')"
          echo "SILL_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Store the notary credentials in that keychain
        env:
          SILL_NOTARY_KEY_ID: ${{ secrets.SILL_NOTARY_KEY_ID }}
          SILL_NOTARY_ISSUER_ID: ${{ secrets.SILL_NOTARY_ISSUER_ID }}
          SILL_NOTARY_KEY_P8: ${{ secrets.SILL_NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          key="$RUNNER_TEMP/sill-notary-key.p8"
          printf '%s' "$SILL_NOTARY_KEY_P8" | base64 --decode > "$key"
          # Validates the key with Apple before saving it, so a wrong key fails here.
          xcrun notarytool store-credentials sill-notary --key "$key" --key-id "$SILL_NOTARY_KEY_ID" \
            --issuer "$SILL_NOTARY_ISSUER_ID" --keychain "$keychain"
          rm -f "$key"
          echo "SILL_NOTARY_PROFILE=sill-notary" >> "$GITHUB_ENV"

      - name: Build, notarize and publish (Scripts/release.sh --publish)
        env:
          # This repository's releases with its own token. For another repository's (the public
          # sill-site, while this one is private): the variable SILL_RELEASE_REPO and a token for
          # it in the secret SILL_RELEASE_TOKEN.
          SILL_RELEASE_REPO: ${{ vars.SILL_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.SILL_RELEASE_TOKEN || github.token }}
        run: Scripts/release.sh --publish

      # Both submissions' answers and logs: the zip's (Sill-<version>-notary*) and the disk image's
      # (Sill-<version>-dmg-notary*). include-hidden-files: upload-artifact skips every file and folder
      # whose name starts with a dot, the search's root included, so without it these patterns found
      # nothing under .build and the step passed without an artifact (it never kept one). No files
      # is a warning: a run that stopped before Apple answered has none.
      - name: Keep Apple's notary logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notary-${{ env.SILL_RELEASE_TAG }}
          path: |
            .build/Sill-*-notary.plist
            .build/Sill-*-notary-log.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: warn

      - name: Delete the keychain and the key files
        if: always()
        run: |
          keychain="$RUNNER_TEMP/sill-release.keychain-db"
          rm -f "$RUNNER_TEMP/sill-developer-id.p12" "$RUNNER_TEMP/sill-notary-key.p8"
          if [ -f "$keychain" ]; then
            security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
            security delete-keychain "$keychain"
          fi
          echo "Keychains left: $(security list-keychains -d user | tr -d ' "' | tr '\n' ' ')"

  # Sill for Windows, from the same tag: Sill.exe (Windows/src/Sill.Viewer published self-contained
  # and single-file, named Sill.exe) zipped per architecture, x64 and arm64, each under its version's
  # name and a version-free one (Sill-windows-x64.zip, the name the site's download page links through
  # /releases/latest/download/, as Sill.dmg is the Mac's), with a .sha256 file each. Unsigned for now
  # (docs/release-checklist.md, "Sill for Windows"): SmartScreen asks on first run.
  #
  # It runs after the Mac's job, so in the signed path the release that job created gets these files
  # (gh release upload); without SILL_SIGN_IN_CI it keeps them as this run's artifact and publishes
  # nothing. A Mac publish that failed stops it.
  windows:
    name: Sill for Windows (attached when publishing)
    needs: publish
    if: ${{ !cancelled() && (needs.publish.result == 'success' || (vars.SILL_SIGN_IN_CI != 'true' && needs.publish.result == 'skipped')) }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write # gh release upload, with this repository's own token
    defaults:
      run:
        shell: pwsh
        working-directory: Windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.SILL_RELEASE_TAG }}
          persist-credentials: false

      # As in windows.yml: .NET from Microsoft's own install script, the SDK global.json names.
      - name: Install the .NET SDK
        run: |
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile "$env:RUNNER_TEMP/dotnet-install.ps1"
          & "$env:RUNNER_TEMP/dotnet-install.ps1" -JsonFile global.json -InstallDir "$env:RUNNER_TEMP/dotnet"
          "$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$env:RUNNER_TEMP/dotnet" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # One version for every platform: the tag's must be Directory.Build.props' Version (which in
      # turn is Packaging/Info.plist's, as release.sh --check-tag checks for the Mac).
      - name: Check the tag against Windows/Directory.Build.props
        run: |
          $tag = $env:SILL_RELEASE_TAG
          if ($tag -notmatch '^v(\d+(\.\d+)*)$') { Write-Output "::error::The tag $tag is not v<version>."; exit 1 }
          $version = $Matches[1]
          $props = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($props -ne $version) { Write-Output "::error::Windows/Directory.Build.props says Version $props, the tag $tag. Set it to $version (Sill's one version) and tag again."; exit 1 }
          "SILL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test
        run: |
          dotnet build Sill.Windows.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test Sill.Windows.slnx -c Release --no-build

      - name: Publish Sill.exe for x64 and arm64, and zip each
        env:
          SILL_SIGN_IN_CI: ${{ vars.SILL_SIGN_IN_CI }}
        run: |
          $version = $env:SILL_VERSION
          $dist = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/dist"
          foreach ($arch in 'x64', 'arm64') {
            $out = "$env:RUNNER_TEMP/publish-$arch"
            dotnet publish src/Sill.Viewer -c Release -r "win-$arch" --self-contained `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:SillExeName=Sill -p:Version=$version -o $out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $exe = Join-Path $out 'Sill.exe'
            if (-not (Test-Path $exe)) { Write-Output "::error::dotnet publish made no Sill.exe for $arch."; exit 1 }
            # SelfInstall compares the installed copy's version resource, which only a Windows build stamps.
            $stamped = (Get-Item $exe).VersionInfo.ProductVersion
            if (-not "$stamped".StartsWith($version)) { Write-Output "::error::Sill.exe for $arch says version '$stamped', not $version."; exit 1 }
            foreach ($name in "Sill-$version-windows-$arch.zip", "Sill-windows-$arch.zip") {
              $zip = Join-Path $dist $name
              Compress-Archive -Path $exe -DestinationPath $zip -Force
              $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
              # shasum's format, as Sill.dmg.sha256: the hash, two spaces, the name.
              "$hash  $name" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
              "$name  $hash  $([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          if ($env:SILL_SIGN_IN_CI -ne 'true') {
            "Nothing was published: the repository variable SILL_SIGN_IN_CI is not true. The zips are unsigned, as a release's are." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Keep the zips as this run's artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ env.SILL_RELEASE_TAG }}
          path: ${{ runner.temp }}/dist
          retention-days: 14
          if-no-files-found: error

      # The Mac's job made the release v<version> (Scripts/release.sh --publish); these join it.
      - name: Attach them to the release
        if: vars.SILL_SIGN_IN_CI == 'true'
        env:
          SILL_RELEASE_REPO: ${{ vars.SILL_RELEASE_REPO || github.repository }}
          GH_TOKEN: ${{ secrets.SILL_RELEASE_TOKEN || github.token }}
        run: |
          $files = Get-ChildItem "$env:RUNNER_TEMP/dist" | ForEach-Object { $_.FullName }
          gh release upload $env:SILL_RELEASE_TAG @files --repo $env:SILL_RELEASE_REPO
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::gh release upload failed for $env:SILL_RELEASE_TAG in $env:SILL_RELEASE_REPO (its message is above)."; exit 1 }
          "Attached to $env:SILL_RELEASE_TAG in ${env:SILL_RELEASE_REPO}: $((Get-ChildItem "$env:RUNNER_TEMP/dist").Name -join ', ')" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
