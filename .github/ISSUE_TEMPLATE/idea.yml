name: Idea
description: Something Sill could do, or do better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What you would like Sill to do, and what it would let you do that you can't today.
    validations:
      required: true
  - type: input
    id: devices
    attributes:
      label: Your Mac and your iPhone or iPad
      description: Optional, when the idea is about one of them.
